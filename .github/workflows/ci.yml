name: CI

on:
  push:
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Garde-fou données personnelles
        run: python scripts/check_no_pii.py

      - name: Installation
        run: pip install -e ".[dev]"

      - name: Qualité du code (ruff)
        run: ruff check src tests scripts

      - name: Tests
        run: pytest -q

      - name: Démo de bout en bout sur boîte fictive
        run: branddeals demo --out demo_output
